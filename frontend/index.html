<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Frases del Día - CI/CD Project</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 40px; text-align: center; }
    .card { background: white; padding: 20px; border-radius: 8px; margin: 10px auto; max-width: 500px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h1 { color: #333; }
  </style>
</head>
<body>
  <h1> Portal de Frases (Entrega 1 - Docker)</h1>
  <div id="quotes-container">Cargando frases desde el backend...</div>

  <script>
    fetch('http://localhost:3000/api/quotes')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('quotes-container');
        container.innerHTML = data.map(q => `
          <div class="card">
            <p>"${q.text}"</p>
            <small><strong>- ${q.author}</strong></small>
          </div>
        `).join('');
      })
      .catch(err => {
        document.getElementById('quotes-container').innerText = 'Error al conectar con el backend.';
      });
  </script>
</body>
</html>
